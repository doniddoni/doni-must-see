<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Must See">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
<title>Doni's Must See</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f5c'/%3E%3Cpath d='M18 20h28v26l-14-8-14 8z' fill='%23f3f5f2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위쪽 고정 바(날짜 띠 + 채널 칩) 아래로 채널별 묶음이 이어지는 한 줄 읽기 화면 */
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#1b2320; --muted:#5d6b66; --line:#dfe5e1;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e2eee9; --mark:#f6e7a8;
  --gold:#c08a12; --gold-ink:#ffffff;
  --shadow:0 1px 2px rgba(20,40,34,.06),0 4px 14px rgba(20,40,34,.05);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121715;--paper:#1a211e;--ink:#e3ebe7;--muted:#97a7a0;--line:#2b3531;
    --accent:#5fbfa3;--accent-ink:#0d1714;--accent-soft:#1f3a32;--mark:#5a4d1a;
    --gold:#e7b84a;--gold-ink:#1a1405;
    --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 잠금 화면 */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px var(--gutter-r) 24px var(--gutter-l)}
.lock form{width:100%;max-width:340px;display:grid;gap:14px}
.lock h1{font:700 30px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.lock label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:#c0392b;font-size:14px;min-height:1.2em}

/* 상단 */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px var(--gutter-r) 6px var(--gutter-l);max-width:860px;margin:0 auto}
.brand{font:700 20px/1.2 var(--f-display);margin:0;white-space:nowrap}
.brand small{display:block;font:400 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.icon-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mk-btn{text-decoration:none;color:var(--ink);font-weight:600}
.runbtn{font-size:15px;line-height:1;padding:5px 10px;font-variant-numeric:tabular-nums}
.runbtn.busy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:12.5px}
.runbtn.busy::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rbspin .8s linear infinite;vertical-align:-1px}
@keyframes rbspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.runbtn.busy::before{animation:none}}
@media (max-width:440px){.top{gap:6px}.top .icon-btn{padding:5px 9px;font-size:12.5px}}
.search{padding:0 var(--gutter-r) 8px var(--gutter-l);max-width:860px;margin:0 auto}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.week{max-width:860px;margin:0 auto;padding:0 var(--gutter-r) 8px var(--gutter-l)}
.wk-bar{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wk-nav{flex:0 0 auto;width:32px;height:32px;border:1px solid var(--line);background:var(--paper);border-radius:999px;cursor:pointer;font-size:18px;line-height:1;padding:0}
.wk-nav:disabled{opacity:.35;cursor:default}
.wk-label{flex:0 1 auto;min-width:0;border:0;background:transparent;font:600 15px/1.3 var(--f-body);cursor:pointer;padding:6px 2px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-label small{font:12px var(--f-mono);color:var(--muted);margin-left:6px}
.wk-label small::after{content:" ▾";color:var(--accent)}
.wk-label[aria-expanded="true"] small::after{content:" ▴"}
.star-tab{flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.star-tab b{color:var(--gold);font-weight:600}
.star-tab i{font-style:normal;font:12px var(--f-mono);color:var(--muted);margin-left:4px}
.star-tab.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.star-tab.on b,.star-tab.on i{color:var(--gold-ink)}
.wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 0;text-align:center;cursor:pointer;line-height:1.2}
.day span{display:block;font-size:11px;color:var(--muted)}
.day b{display:block;font:500 16px/1.25 var(--f-mono)}
.day i{display:block;font-style:normal;font:500 11px/1.3 var(--f-mono);color:var(--accent)}
.day:disabled{background:transparent;border-color:transparent;cursor:default}
.day:disabled b,.day:disabled i{color:var(--muted);opacity:.5}
.day.today:not(.on){border-color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.on span,.day.on i{color:var(--accent-ink)}
.cal{max-width:860px;margin:0 auto;padding:0 var(--gutter-r) 10px var(--gutter-l)}
.cal-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;box-shadow:var(--shadow);max-width:420px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal-head h3{flex:1;margin:0;text-align:center;font:700 16px/1.3 var(--f-display)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--muted);padding:2px 0}
.cal-grid .wd.sun{color:#c0392b}
.cal-d{min-width:0;border:0;background:transparent;border-radius:8px;padding:4px 0 3px;cursor:pointer;font:500 14px/1.2 var(--f-mono);color:var(--ink)}
.cal-d i{display:block;font-style:normal;font-size:10px;color:var(--accent);min-height:1.2em}
.cal-d:not(:disabled){background:var(--accent-soft)}
.cal-d:disabled{color:var(--muted);opacity:.45;cursor:default}
.cal-d.today{outline:1px solid var(--accent);outline-offset:-1px}
.cal-d.on{background:var(--accent);color:var(--accent-ink)}
.cal-d.on i{color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 var(--gutter-r) 10px var(--gutter-l);max-width:860px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip em{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-left:4px;font-size:12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* 본문 */
main{max-width:860px;margin:0 auto;padding:14px var(--gutter-r) 64px var(--gutter-l)}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:6px 0 14px}
.dayhead h2{font:700 24px/1.25 var(--f-display);margin:0;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted);font-size:13px}
.dayhead .sp{flex:1}
.sortseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.sortseg button{border:0;background:transparent;color:var(--muted);padding:4px 11px;font:500 12.5px/1.3 var(--f-body);cursor:pointer;white-space:nowrap}
.sortseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.meta .srcn{font-family:var(--f-body);font-weight:600;color:var(--ink)}
.ch{margin:0 0 22px}
.chh{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;border-bottom:2px solid var(--accent);margin-bottom:10px;flex-wrap:wrap}
.chh h3{margin:0;font-size:16px;font-weight:600}
.chh a,.chh span{font:12px var(--f-mono);color:var(--muted);text-decoration:none}
.chh .n{margin-left:auto}
.it{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font:12px/1.4 var(--f-mono);color:var(--muted);margin-bottom:6px}
.meta a{text-decoration:none}
.meta .dt{color:var(--ink);opacity:.75}
.tx{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.tx blockquote{margin:4px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.tx pre,.tx code{font-family:var(--f-mono);font-size:13px;background:var(--bg);border-radius:4px;padding:0 3px}
.tx pre{overflow-x:auto;padding:8px}
.tx .sp-hide{background:var(--ink);color:transparent;border-radius:3px;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px}
.ph{display:grid;gap:4px;margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ph.one{grid-template-columns:1fr}
.ph button{border:0;padding:0;background:var(--bg);border-radius:8px;overflow:hidden;cursor:zoom-in;display:block;min-height:60px}
.ph img{width:100%;height:auto;display:block;max-height:520px;object-fit:contain;background:var(--bg)}
.ph:not(.one) img{aspect-ratio:1;object-fit:cover}
.card{display:block;margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink);font-size:13px;line-height:1.5;min-width:0}
.card b{display:block}
.card span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card small{display:block;font-family:var(--f-mono);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid{position:relative;display:inline-block;margin-top:8px;border-radius:8px;overflow:hidden;text-decoration:none;color:#fff;background:#000;min-width:160px;min-height:60px}
.vid img{display:block;max-width:100%;max-height:300px;opacity:.85}
.vid span{position:absolute;left:8px;bottom:6px;font:12px var(--f-mono);background:rgba(0,0,0,.6);padding:2px 8px;border-radius:999px}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.star{margin-left:auto;border:0;background:transparent;cursor:pointer;font-size:19px;line-height:1;padding:2px 2px 2px 8px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold)}
.it.starred{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:inset 3px 0 0 var(--gold),var(--shadow)}
.note{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.result-day{font:700 18px/1.3 var(--f-display);margin:20px 0 8px}

/* 사진 크게 보기 */
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,10,8,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 44px) var(--gutter-r) calc(env(safe-area-inset-bottom,0px) + 44px) var(--gutter-l)}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px)}
.lb .pv{left:calc(env(safe-area-inset-left,0px) + 8px);top:50%}
.lb .nx{right:calc(env(safe-area-inset-right,0px) + 8px);top:50%}
.lb .cnt{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;text-align:center;color:#cfd8d4;font:12px var(--f-mono)}
/* 형광펜·메모 */
.tx mark.hl{background:color-mix(in srgb,var(--gold) 38%,transparent);border-radius:2px;cursor:pointer}
.nbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:6px;font-size:13.5px}
.nbox[hidden]{display:none}
.nbox .nlab{font:600 11.5px/1.3 var(--f-body);color:var(--muted)}
.hli{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:start;background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:8px;padding:6px 8px}
.hli q{quotes:none;font-weight:500;overflow-wrap:anywhere}
.hli .hm{grid-column:1/-1;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.hli .acts{display:flex;gap:4px}
.nbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:1px 9px;font:12px/1.6 var(--f-body);cursor:pointer;white-space:nowrap}
.nbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ninp{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;resize:vertical}
.pmemo{white-space:pre-wrap;overflow-wrap:anywhere}
.mbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font:12px var(--f-mono);padding:0}
.it.noted .mbtn{color:var(--accent)}
.hlbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:25;width:min(560px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px 12px;display:grid;gap:8px}
.hlbar .q{font-size:14px;max-height:4.4em;overflow:hidden;overflow-wrap:anywhere}
.hlbar .b{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
@media (prefers-reduced-motion: no-preference){.it{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}}}
</style>
</head>
<body>

<section class="lock" id="lock">
  <form id="lockForm" autocomplete="on">
    <h1>Doni's Must See</h1>
    <p>Must See에 모아둔 텔레그램 글을 날짜·채널별로 다시 보는 곳이에요.</p>
    <input type="text" name="username" value="mustsee" autocomplete="username" hidden>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <label><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
    <button class="btn" id="unlockBtn" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="top">
      <h1 class="brand">Must See<small id="updated"></small></h1>
      <span class="sp"></span>
      <button class="icon-btn runbtn" id="runBtn" type="button" aria-label="텔레그램에서 지금 가져오기" title="텔레그램에서 지금 가져오기">↻</button>
      <a class="icon-btn mk-btn" id="marketBtn" href="market.html">마켓</a>
      <button class="icon-btn" id="searchBtn" type="button" aria-expanded="false">검색</button>
      <button class="icon-btn" id="pdfBtn" type="button">PDF</button>
      <button class="icon-btn" id="lockBtn" type="button" title="이 기기에서 잠그기">잠금</button>
    </div>
    <div class="search" id="searchBox" hidden>
      <input id="q" type="search" placeholder="모든 날짜에서 찾기 (예: 구리, 관세)" enterkeyhint="search">
    </div>
    <nav class="week" id="week" aria-label="날짜">
      <div class="wk-bar">
        <button class="wk-nav" id="wkPrev" type="button" aria-label="이전 주">‹</button>
        <button class="wk-label" id="wkLabel" type="button" aria-expanded="false" aria-controls="cal" title="달력에서 고르기"></button>
        <button class="wk-nav" id="wkNext" type="button" aria-label="다음 주">›</button>
        <button class="star-tab" id="starBtn" type="button"><b>★ 중요</b><i id="starCount">0</i></button>
      </div>
      <div class="wk-days" id="wkDays"></div>
    </nav>
    <div class="cal" id="cal" hidden>
      <div class="cal-box">
        <div class="cal-head">
          <button class="wk-nav" id="calPrev" type="button" aria-label="이전 달">‹</button>
          <h3 id="calTitle"></h3>
          <button class="wk-nav" id="calNext" type="button" aria-label="다음 달">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="채널"></nav>
  </header>
  <main id="main"></main>
  <div class="hlbar" id="hlbar" hidden>
    <div class="q" id="hlq"></div>
    <input class="ninp" id="hlmemo" type="text" placeholder="메모 (선택) — 생각, 질문 등" autocomplete="off">
    <div class="b"><button type="button" class="nbtn" id="hlx">닫기</button><button type="button" class="nbtn pri" id="hlsave">형광펜</button></div>
  </div>
</div>

<div class="lb" id="lb" hidden>
  <img id="lbImg" alt="">
  <button class="x" id="lbX" type="button" aria-label="닫기">✕</button>
  <button class="pv" id="lbPv" type="button" aria-label="이전">‹</button>
  <button class="nx" id="lbNx" type="button" aria-label="다음">›</button>
  <div class="cnt" id="lbCnt"></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const LS = "mustsee.key.v1";
const SS = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch {} }, del(k){ try { sessionStorage.removeItem(k); } catch {} } };
const WEEK = "일월화수목금토";
const enc = new TextEncoder(), dec = new TextDecoder();
let key = null, meta = null, index = null;
let cur = { day: null, ch: "all" };
const dayCache = new Map(), blobCache = new Map();

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function fetchBin(path){
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error("파일을 불러오지 못했어요 (" + r.status + ")");
  return new Uint8Array(await r.arrayBuffer());
}
async function open(bytes){
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0,12) }, key, bytes.slice(12)));
}
async function openJSON(path){ return JSON.parse(dec.decode(await open(await fetchBin(path)))); }

async function deriveRaw(pw){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(meta.salt), iterations: meta.iter }, base, 256);
}
async function useRaw(raw){
  key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
  const ok = dec.decode(await open(b64d(meta.check)));
  if (ok !== "mustsee-ok") throw new Error("bad");
}

// 새 화면이 올라갔는데 기기가 예전 화면을 저장해두고 있으면, 주소를 살짝 바꿔 새로 불러온다
const VIEWER_VERSION = "beebd77be7bb";
function needsUpdate(latest){
  if (!latest || latest === VIEWER_VERSION) return false;
  const tried = new URLSearchParams(location.search).get("v");
  if (tried === latest) return false;   // 이미 한 번 시도함 (반복 방지)
  location.replace(location.pathname + "?v=" + latest + location.hash);
  return true;
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !meta) return;
  try {
    const m = await (await fetch("data/meta.json", { cache: "no-cache" })).json();
    needsUpdate(m.viewer);
  } catch {}
});

async function boot(){
  try { meta = await (await fetch("data/meta.json", { cache: "no-cache" })).json(); }
  catch { $("err").textContent = "아직 데이터가 없어요. 첫 수집이 끝나면 다시 열어주세요."; return; }
  if (needsUpdate(meta.viewer)) return;
  const saved = store.get(LS) || SS.get(LS);
  if (saved){
    try {
      const s = JSON.parse(saved);
      if (s.salt === meta.salt){ await useRaw(b64d(s.k)); return start(); }
    } catch {}
    store.del(LS);
  }
  $("pw").focus();
}

$("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!meta) return;
  const btn = $("unlockBtn");
  btn.disabled = true; btn.textContent = "여는 중…"; $("err").textContent = "";
  try {
    const raw = await deriveRaw($("pw").value);
    await useRaw(raw);
    if ($("remember").checked) store.set(LS, JSON.stringify({ salt: meta.salt, k: b64e(raw) }));
    SS.set(LS, JSON.stringify({ salt: meta.salt, k: b64e(raw) }));
    if (new URLSearchParams(location.search).get("next") === "market"){ location.replace("market.html"); return; }
    $("pw").value = "";
    await start();
  } catch {
    $("err").textContent = "비밀번호가 맞지 않아요. 다시 입력해 주세요.";
  } finally { btn.disabled = false; btn.textContent = "열기"; }
});

$("lockBtn").addEventListener("click", () => {
  store.del(LS); SS.del(LS); key = null; dayCache.clear(); sync = null;
  blobCache.forEach(u => URL.revokeObjectURL(u)); blobCache.clear();

  $("lock").hidden = true; $("app").hidden = false;
  $("updated").textContent = index.updated ? "업데이트 " + index.updated : "";

// ---------------------------------------------------------------- 중요 표시
// stars: { 메시지번호: {d: 날짜, t: 표시한 시각} }
// 기기 안(localStorage)에 바로 저장하고, GitHub 열쇠가 있으면 doni-must-see의 stars 브랜치에
// 암호화해서 올려 다른 기기와 맞춘다. 실패한 변경은 pending에 남겨 다음에 다시 올린다.
const STAR_LS = "mustsee.stars.v1";
let stars = {}, pending = [], sync = null, syncState = "local";

function saveLocalStars(){ store.set(STAR_LS, JSON.stringify({ salt: meta.salt, stars, pending })); }
function loadLocalStars(){
  try {
    const s = JSON.parse(store.get(STAR_LS) || "{}");
    if (s.salt === meta.salt){ stars = s.stars || {}; pending = s.pending || []; }
  } catch {}
}
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
function bytesToB64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); }
function ghURL(){ return `https://api.github.com/repos/${sync.repo}/contents/${sync.path}`; }
function ghHeaders(){ return { Authorization: "Bearer " + sync.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; }
async function fetchRemote(){
  const r = await fetch(ghURL() + "?ref=" + encodeURIComponent(sync.branch) + "&_=" + Date.now(), { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 404) return { stars: {}, sha: null };
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth: true });
  if (!r.ok) throw new Error("remote " + r.status);
  const j = await r.json();
  // contents API 는 암호화된 바이트를 글자로 오인해 바꿔 보낼 때가 있음 → 원본은 git blob 으로 받기
  const b = await fetch(`https://api.github.com/repos/${sync.repo}/git/blobs/${j.sha}`, { headers: ghHeaders(), cache: "no-store" });
  if (!b.ok) throw new Error("blob " + b.status);
  const data = JSON.parse(dec.decode(await open(b64d((await b.json()).content.replace(/\s/g, "")))));
  return { stars: data.stars || {}, sha: j.sha };
}
function applyOps(base, ops){
  const s = { ...base };
  for (const op of ops){ if (op.on) s[op.id] = { d: op.d, t: op.t }; else delete s[op.id]; }
  return s;
}
let flushing = null;
async function flush(){
  if (!sync) return;
  if (flushing) return flushing;
  flushing = (async () => {
    for (let attempt = 0; attempt < 4; attempt++){
      const ops = pending.slice();
      try {
        const remote = await fetchRemote();
        const merged = applyOps(remote.stars, ops);
        if (ops.length){
          const body = { message: "stars", branch: sync.branch, content: bytesToB64(await seal({ v: 1, stars: merged })) };
          if (remote.sha) body.sha = remote.sha;
          const r = await fetch(ghURL(), { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
          if (r.status === 409 || r.status === 422) continue;   // 다른 기기가 먼저 저장함 → 다시 받아서 합치기
          if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth: true });
          if (!r.ok) throw new Error("put " + r.status);
        }
        pending = pending.slice(ops.length);
        stars = applyOps(merged, pending);
        syncState = "synced"; saveLocalStars(); refreshStarUI();
        return;
      } catch (e) {
        syncState = e.auth ? "auth" : "offline";
        if (e.auth) break;
        await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
      }
    }
    saveLocalStars();
    if (pending.length) toast(syncState === "auth" ? "중요 표시 동기화 열쇠가 만료됐어요. 이 기기에는 저장해뒀어요." : "다른 기기와 맞추지 못했어요. 이 기기에는 저장해뒀어요.");
  })();
  try { await flushing; } finally { flushing = null; }
}
/* ↻ 지금 가져오기: 텔레그램 수집 작업(GitHub Actions)을 바로 실행하고, 끝나면 새로 불러옴 */
const RUNK = "mustsee.run.v1";
let runTimer = null;
function runApi(path, opt = {}){
  return fetch("https://api.github.com/repos/" + sync.run_repo + path, Object.assign({ cache: "no-store" }, opt, {
    headers: Object.assign({ Authorization: "Bearer " + sync.run, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }, opt.headers || {}) }));
}
function runLabel(t0, txt){
  const b = $("runBtn"); if (!b) return;
  if (!t0){ b.classList.remove("busy"); b.textContent = "↻"; b.disabled = false; return; }
  const s = Math.max(0, Math.round((Date.now() - t0) / 1000));
  b.classList.add("busy"); b.disabled = true; b.textContent = (txt || "가져오는 중") + " " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function runSave(o){ try { o ? sessionStorage.setItem(RUNK, JSON.stringify(o)) : sessionStorage.removeItem(RUNK); } catch {} }
async function runTrack(st){
  // st = { t0, id? } — id 가 없으면 방금 실행한 작업을 찾는다
  runSave(st); clearInterval(runTimer);
  runTimer = setInterval(() => runLabel(st.t0, st.done ? "반영 중" : null), 1000); runLabel(st.t0);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    for (let i = 0; i < 150; i++){
      if (!st.id){
        const r = await runApi("/actions/workflows/" + sync.run_wf + "/runs?per_page=5");
        if (r.ok){ const j = await r.json(); const hit = (j.workflow_runs || []).find(x => Date.parse(x.created_at) >= st.t0 - 60000 || x.status !== "completed"); if (hit){ st.id = hit.id; runSave(st); } }
      } else {
        const r = await runApi("/actions/runs/" + st.id);
        if (r.ok){
          const j = await r.json();
          if (j.status === "completed"){
            if (j.conclusion !== "success"){ clearInterval(runTimer); runSave(null); runLabel(0); toast("가져오기가 실패했어요 · 텔레그램 알림을 확인해 주세요"); return; }
            st.done = true; runSave(st);
            await wait(45000);                         // 페이지 배포가 끝날 때까지
            clearInterval(runTimer); runSave(null); location.reload(); return;
          }
        }
      }
      await wait(6000);
    }
  } catch {}
  clearInterval(runTimer); runSave(null); runLabel(0); toast("진행 상황을 확인하지 못했어요 · 잠시 뒤 새로고침해 주세요");
}
async function runNow(){
  if (!sync || !sync.run){ toast("‘지금 가져오기’ 열쇠가 아직 등록되지 않았어요"); return; }
  const t0 = Date.now(); runLabel(t0, "시작");
  try {
    // 이미 돌고 있는 작업이 있으면 그걸 따라간다
    const cur = await runApi("/actions/workflows/" + sync.run_wf + "/runs?per_page=3");
    if (cur.status === 401 || cur.status === 403 || cur.status === 404){ runLabel(0); toast("‘지금 가져오기’ 열쇠 권한을 확인해 주세요 (" + cur.status + ")"); return; }
    const busy = cur.ok ? ((await cur.json()).workflow_runs || []).find(x => x.status !== "completed") : null;
    if (busy){ toast("이미 가져오는 중이에요 · 끝나면 새로 불러올게요"); return runTrack({ t0: Date.parse(busy.created_at) || t0, id: busy.id }); }
    const r = await runApi("/actions/workflows/" + sync.run_wf + "/dispatches", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ref: "main" }) });
    if (!r.ok){ runLabel(0); toast("실행하지 못했어요 (" + r.status + ")"); return; }
    toast("텔레그램에서 가져오는 중 · 보통 2~3분");
    runTrack({ t0 });
  } catch { runLabel(0); toast("GitHub에 접속하지 못했어요"); }
}
async function initStars(){
  loadLocalStars();
  try { sync = await openJSON("data/sync.bin"); } catch { sync = null; }
  $("runBtn").onclick = runNow;
  if (!sync || !sync.run) $("runBtn").title = "텔레그램에서 지금 가져오기 (열쇠 등록 필요)";
  try { const p = JSON.parse(sessionStorage.getItem(RUNK) || "null"); if (p && sync && sync.run && Date.now() - p.t0 < 15 * 60000) runTrack(p); } catch {}
  loadLocalNotes();
  if (sync) await flush();
  if (sync) flushNotes();
}
function toggleStar(it){
  const on = !stars[it.id];
  const op = { id: String(it.id), on, d: it.date, t: Date.now() };
  stars = applyOps(stars, [op]);
  if (sync) pending.push(op);
  saveLocalStars(); refreshStarUI();
  if (sync) flush();
}
function refreshStarUI(){
  document.querySelectorAll(".star[data-id]").forEach(b => {
    const on = !!stars[b.dataset.id];
    b.setAttribute("aria-pressed", on); b.textContent = on ? "★" : "☆";
    b.setAttribute("aria-label", on ? "중요 표시 해제" : "중요 표시");
    b.closest(".it")?.classList.toggle("starred", on);
  });
  $("starCount").textContent = Object.keys(stars).length;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sync && key){ flush(); flushNotes(); } });

/* ---- 글 형광펜·메모: stars 브랜치 notes.bin (암호화) → 기기끼리 맞추고, Market Archive 'Must See' 탭에도 넘어감
   notes = { "<글 id>": { d, hl: [{ k, text, memo }], memo, t } } — 글마다 나중에 고친 쪽이 이김 */
const NOTE_LS = "mustsee.notes.v1", NOTE_PATH = "notes.bin";
let notes = {}, notesDirty = new Set(), noteTimer = null, noteFlushing = null;
const ITEMS = new Map();
function saveLocalNotes(){ store.set(NOTE_LS, JSON.stringify({ salt: meta.salt, notes, dirty: [...notesDirty] })); }
function loadLocalNotes(){
  try { const s = JSON.parse(store.get(NOTE_LS) || "{}"); if (s.salt === meta.salt){ notes = s.notes || {}; notesDirty = new Set(s.dirty || []); } } catch {}
}
const noteURL = () => `https://api.github.com/repos/${sync.repo}/contents/${NOTE_PATH}`;
async function fetchNotes(){
  const r = await fetch(noteURL() + "?ref=" + encodeURIComponent(sync.branch) + "&_=" + Date.now(), { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 404) return { notes: {}, sha: null };
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth: true });
  if (!r.ok) throw new Error("notes " + r.status);
  const j = await r.json();
  const b = await fetch(`https://api.github.com/repos/${sync.repo}/git/blobs/${j.sha}`, { headers: ghHeaders(), cache: "no-store" });
  if (!b.ok) throw new Error("blob " + b.status);
  const data = JSON.parse(dec.decode(await open(b64d((await b.json()).content.replace(/\s/g, "")))));
  return { notes: data.notes || {}, sha: j.sha };
}
function mergeNotes(a, b){
  const out = { ...a };
  for (const [k, v] of Object.entries(b || {})) if (v && (!out[k] || (v.t || 0) > (out[k].t || 0))) out[k] = v;
  return out;
}
async function flushNotes(){
  if (!sync) return;
  if (noteFlushing) return noteFlushing;
  noteFlushing = (async () => {
    for (let attempt = 0; attempt < 4; attempt++){
      const ids = [...notesDirty];
      try {
        const remote = await fetchNotes();
        const mine = {}; ids.forEach(id => { if (notes[id]) mine[id] = notes[id]; });
        const merged = mergeNotes(remote.notes, mine);
        if (ids.length){
          const body = { message: "notes", branch: sync.branch, content: bytesToB64(await seal({ v: 1, notes: merged })) };
          if (remote.sha) body.sha = remote.sha;
          const r = await fetch(noteURL(), { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
          if (r.status === 409 || r.status === 422) continue;
          if (r.status === 401 || r.status === 403 || r.status === 404) throw Object.assign(new Error("auth"), { auth: true });
          if (!r.ok) throw new Error("put " + r.status);
        }
        ids.forEach(id => notesDirty.delete(id));
        const keepMine = {}; notesDirty.forEach(id => { if (notes[id]) keepMine[id] = notes[id]; });
        notes = mergeNotes(merged, keepMine);
        saveLocalNotes(); refreshNotesUI();
        return;
      } catch (e) {
        if (e.auth) break;
        await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
      }
    }
    saveLocalNotes();
    if (notesDirty.size) toast("메모를 다른 기기와 맞추지 못했어요. 이 기기에는 저장해뒀어요.");
  })();
  try { await noteFlushing; } finally { noteFlushing = null; }
}
function editNote(it, fn){
  const id = String(it.id);
  const n = JSON.parse(JSON.stringify(notes[id] || { hl: [], memo: "" }));
  n.hl = n.hl || []; fn(n); n.d = it.date; n.t = Date.now();
  notes[id] = n; notesDirty.add(id); saveLocalNotes();
  clearTimeout(noteTimer); if (sync) noteTimer = setTimeout(flushNotes, 700);
  refreshNotesUI();
}
function hasNote(id){ const n = notes[String(id)]; return !!(n && ((n.hl || []).length || (n.memo || "").trim())); }
/* 형광펜: 글 안에서 같은 문장을 찾아 칠함 (굵게·링크 등에 걸쳐 있어도) */
function applyHl(root, list){
  for (const h of list || []){
    if (!h.text) continue;
    const nodes = []; let full = "";
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (tw.nextNode()){ nodes.push([tw.currentNode, full.length]); full += tw.currentNode.data; }
    const i = full.indexOf(h.text); if (i < 0) continue;
    const j = i + h.text.length;
    for (const [n, off] of nodes){
      const s0 = Math.max(i, off), e0 = Math.min(j, off + n.data.length);
      if (s0 >= e0) continue;
      let t = n;
      if (s0 > off) t = t.splitText(s0 - off);
      if (e0 - s0 < t.data.length) t.splitText(e0 - s0);
      const mk = document.createElement("mark"); mk.className = "hl"; mk.dataset.k = h.k;
      t.replaceWith(mk); mk.append(t);
    }
  }
}
function fillText(art, it, hl){
  const tx = art.querySelector(":scope > .tx"); if (!tx || !it.html) return;
  tx.textContent = ""; tx.append(...clean(it.html, hl).childNodes);
  const n = notes[String(it.id)]; if (n) applyHl(tx, n.hl);
}
function noteBox(art, it){
  const box = art.querySelector(":scope > .nbox"); if (!box) return;
  const id = String(it.id), n = notes[id] || { hl: [], memo: "" }, editing = box.dataset.edit === "1";

  if (!hasNote(id) && !editing){ box.hidden = true; return; }

    const row = document.createElement("div"); row.className = "hli"; row.dataset.k = h.k;
    const q = document.createElement("q"); q.textContent = h.text.length > 200 ? h.text.slice(0, 200) + "…" : h.text; row.append(q);
    const acts = document.createElement("span"); acts.className = "acts";
    const em = document.createElement("button"); em.type = "button"; em.className = "nbtn"; em.textContent = h.memo ? "메모 수정" : "메모";
    const del = document.createElement("button"); del.type = "button"; del.className = "nbtn"; del.textContent = "지우기";
    acts.append(em, del); row.append(acts);
    if (h.memo){ const m = document.createElement("div"); m.className = "hm"; m.textContent = h.memo; row.append(m); }
    em.addEventListener("click", () => {
      if (row.querySelector("input")) return;
      const inp = document.createElement("input"); inp.className = "ninp"; inp.style.gridColumn = "1/-1"; inp.value = h.memo || ""; inp.placeholder = "이 부분에 대한 메모";
      row.append(inp); inp.focus();
      const done = () => { const v = inp.value.trim(); if (v !== (h.memo || "")) editNote(it, x => { x.hl[i].memo = v; }); else noteBox(art, it); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
      inp.addEventListener("blur", done);
    });
    del.addEventListener("click", () => editNote(it, x => { x.hl.splice(i, 1); }));
    box.append(row);
  });
  if (editing){
    const ta = document.createElement("textarea"); ta.className = "ninp"; ta.rows = 3; ta.placeholder = "이 글에 대한 메모 — 왜 담았는지, 시장 영향, 질문 등"; ta.value = n.memo || "";
    const bar = document.createElement("div"); bar.style.cssText = "display:flex;gap:6px;justify-content:flex-end";
    const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "nbtn"; cancel.textContent = "취소";
    const save = document.createElement("button"); save.type = "button"; save.className = "nbtn pri"; save.textContent = "저장";
    bar.append(cancel, save); box.append(ta, bar); ta.focus();
    cancel.addEventListener("click", () => { box.dataset.edit = ""; noteBox(art, it); });
    save.addEventListener("click", () => { box.dataset.edit = ""; editNote(it, x => { x.memo = ta.value.trim(); }); toast("메모 저장"); });

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };

  return null;
}

function groupByChannel(items){
  const order = [], g = new Map();
  for (const it of items){
    if (!g.has(it.src.key)){ g.set(it.src.key, []); order.push(it.src.key); }
    g.get(it.src.key).push(it);
  }
  return order.map(k => {
    const list = g.get(k).slice().sort((a,b) => (a.orig||"").localeCompare(b.orig||"") || a.id - b.id);
    return { src: list[0].src, items: list };
  });
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

const OK_TAGS = new Set(["B","STRONG","I","EM","U","S","DEL","CODE","PRE","BLOCKQUOTE","A","BR","SPAN","TG-SPOILER"]);
function clean(html, hl){
  const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
  const walk = node => {
    for (const el of [...node.children]){
      walk(el);
      if (!OK_TAGS.has(el.tagName)){ el.replaceWith(...el.childNodes); continue; }
      const href = el.getAttribute("href");
      for (const a of [...el.attributes]) el.removeAttribute(a.name);
      if (el.tagName === "A"){
        if (href && /^(https?:|tg:)/i.test(href)){ el.setAttribute("href", href); el.setAttribute("target","_blank"); el.setAttribute("rel","noopener"); }
      }
      if (el.tagName === "TG-SPOILER" || el.tagName === "SPAN") el.className = "sp-hide";
    }
  };
  const root = doc.body.firstChild; walk(root);
  if (hl) markText(root, hl);
  return root;
}
function markText(root, q){
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const t of nodes){
    if (!re.test(t.data)) continue; re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while ((m = re.exec(t.data))){ frag.append(t.data.slice(last, m.index)); const mk = document.createElement("mark"); mk.textContent = m[0]; frag.append(mk); last = m.index + m[0].length; }
    frag.append(t.data.slice(last)); t.replaceWith(frag);
  }
}

async function blobURL(path, type){
  if (!blobCache.has(path)){
    blobCache.set(path, (async () => URL.createObjectURL(new Blob([await open(await fetchBin(path))], { type })))());
  }
  return blobCache.get(path);
}
let io = null;
function lazyImages(){
  if (io) io.disconnect();
  const load = async img => { try { img.src = await blobURL(img.dataset.src, "image/jpeg"); } catch {} };
  if (!("IntersectionObserver" in window)){ document.querySelectorAll("img[data-src]").forEach(load); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); load(e.target); } }), { rootMargin: "600px 0px" });
  document.querySelectorAll("main img[data-src]").forEach(i => io.observe(i));
}

$("lb").addEventListener("click", e => { if (e.target === $("lb")) closeLB(); });
$("lbPv").addEventListener("click", () => { lb.i = (lb.i - 1 + lb.list.length) % lb.list.length; showLB(); });
$("lbNx").addEventListener("click", () => { lb.i = (lb.i + 1) % lb.list.length; showLB(); });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLB();
  if (e.key === "ArrowLeft") $("lbPv").click();
  if (e.key === "ArrowRight") $("lbNx").click();
});
let tx0 = null;
$("lb").addEventListener("touchstart", e => { tx0 = e.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", e => {
  if (tx0 == null || lb.list.length < 2) return;
  const dx = e.changedTouches[0].clientX - tx0; tx0 = null;
  if (Math.abs(dx) > 50) (dx > 0 ? $("lbPv") : $("lbNx")).click();
});

// PDF
$("pdfBtn").addEventListener("click", async () => {
  const d = index.days.find(x => x.date === cur.day);
  if (!d){ toast("PDF는 날짜를 고른 뒤 받을 수 있어요"); return; }
  const btn = $("pdfBtn"); btn.disabled = true; btn.textContent = "PDF 준비 중…";
  try {
    const bytes = await open(await fetchBin(d.pdf));
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a"); a.href = url; a.download = `MustSee_${d.date}.pdf`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast(`${fmtDay(d.date, true)} PDF를 저장했어요`);
  } catch (e) { toast("PDF를 불러오지 못했어요. 잠시 후 다시 눌러주세요."); }
  finally { btn.disabled = false; btn.textContent = "PDF"; }
});

// 검색
function closeSearch(){
  if ($("searchBox").hidden) return;
  $("searchBox").hidden = true; $("q").value = ""; $("searchBtn").classList.remove("on"); $("searchBtn").setAttribute("aria-expanded","false");
  $("week").hidden = false;
}
$("searchBtn").addEventListener("click", () => {
  if (!$("searchBox").hidden){ closeSearch(); cur.day === "starred" ? showStarred() : showDay(cur.day); return; }
  $("searchBox").hidden = false; $("searchBtn").classList.add("on"); $("searchBtn").setAttribute("aria-expanded","true");
  $("q").focus();
});
let qTimer = null;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 250); });
async function runSearch(){
  const q = $("q").value.trim();
  if (!q){ $("week").hidden = false; if (cur.day === "starred") showStarred(); else { renderChips(index.days.find(x => x.date === cur.day)); renderDay(); } return; }
  $("week").hidden = true; closeCal(); $("chips").hidden = true;
  const main = $("main"); main.innerHTML = '<p class="empty">찾는 중…</p>';
  const low = q.toLowerCase(); let total = 0; const frag = document.createDocumentFragment();
  for (const d of index.days){
    let data; try { data = await loadDay(d.date); } catch { continue; }
    const hits = data.items.filter(it => {
      const t = (it.html || "").replace(/<[^>]+>/g, "") + " " + (it.web ? (it.web.title||"") + " " + (it.web.desc||"") : "") + " " + it.src.name;
      return t.toLowerCase().includes(low);
    });
    if (!hits.length) continue;
    total += hits.length;
    const h = document.createElement("h2"); h.className = "result-day";
    const a = document.createElement("a"); a.href = "#" + d.date; a.textContent = fmtDay(d.date, true);
    a.addEventListener("click", e => { e.preventDefault(); closeSearch(); showDay(d.date); });
    h.append(a); frag.append(h);
    for (const grp of groupByChannel(hits)) frag.append(renderGroup(grp, q));
  }
  if ($("q").value.trim() !== q) return;
  main.textContent = "";
  const head = document.createElement("div"); head.className = "dayhead";
  head.innerHTML = `<h2>“${esc(q)}”</h2><p>${total}건</p>`;
  main.append(head);
  if (!total){ const p = document.createElement("p"); p.className = "empty"; p.textContent = "찾는 글이 없어요."; main.append(p); }
  main.append(frag); lazyImages();
}

function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}
window.addEventListener("hashchange", () => {
  const d = decodeURIComponent(location.hash.slice(1));
  if (!index || d === cur.day) return;
  if (d === "starred"){ closeSearch(); showStarred(); }
  else if (index.days.some(x => x.date === d)){ closeSearch(); showDay(d); }
});
document.addEventListener("click", e => { if (e.target.classList?.contains("sp-hide")) e.target.classList.remove("sp-hide"); });

if (!window.crypto || !crypto.subtle){ $("err").textContent = "이 브라우저에서는 열 수 없어요. 최신 크롬·사파리로 열어주세요."; }
else boot();
})();
</script>
