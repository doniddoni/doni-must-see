<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doni Market">
<title>Doni's Market</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232457a6'/%3E%3Cpath d='M14 44l12-14 9 8 15-18' stroke='%23f3f5f8' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: Must See와 같은 틀 — 위쪽 고정 바(이름 + 탭 칩) 아래로 명조 제목, 하얀 카드가 이어짐. 색만 파란 계열 */
/* Must See '마켓' 화면 — research-automation/market/page.html 을 바탕으로 만든 개인용 버전 (데이터는 data/market.bin 암호화 묶음) */
:root {
  --bg: #f3f5f8; --card: #ffffff; --ink: #1b2230; --muted: #5f6a7a; --line: #dfe4ec;
  --accent: #2457a6; --accent-ink: #ffffff; --accent-soft: #e3ecf8;
  --band: #2457a6; --band-ink: #ffffff; --band-muted: #5f6a7a; --band-accent: #2457a6; --band-tab: #2457a6;
  --up: #d93a33; --down: #2b6fd8; --flat: #7b8597; --ma20: #e2912c; --ma50: #8a6ee0;
  --ir: #2457a6; --ir-soft: #e3ecf8; --soft: #eef1f6; --p-soft: #f6efe2; --u-soft: #eeeafb;
  --shadow: 0 1px 2px rgba(20,32,52,.06), 0 4px 14px rgba(20,32,52,.05);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --card: #1a202a; --ink: #e3e8f0; --muted: #97a2b3; --line: #2b3340;
    --accent: #7aa7ff; --accent-ink: #0d1422; --accent-soft: #1d2c45;
    --band: #7aa7ff; --band-ink: #0d1422; --band-muted: #97a2b3; --band-accent: #7aa7ff; --band-tab: #7aa7ff;
    --up: #ff6159; --down: #4d8dff; --flat: #8b95a8; --ma20: #f0a547; --ma50: #a48cff;
    --ir: #7aa7ff; --ir-soft: #1d2c45; --soft: #222a36; --p-soft: #33291a; --u-soft: #2a2545;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --card: #1a202a; --ink: #e3e8f0; --muted: #97a2b3; --line: #2b3340;
  --accent: #7aa7ff; --accent-ink: #0d1422; --accent-soft: #1d2c45;
  --band: #7aa7ff; --band-ink: #0d1422; --band-muted: #97a2b3; --band-accent: #7aa7ff; --band-tab: #7aa7ff;
  --up: #ff6159; --down: #4d8dff; --flat: #8b95a8; --ma20: #f0a547; --ma50: #a48cff;
  --ir: #7aa7ff; --ir-soft: #1d2c45; --soft: #222a36; --p-soft: #33291a; --u-soft: #2a2545;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); margin: 0; -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 900px; margin: 0 auto; box-sizing: border-box;
}
.num { font-variant-numeric: tabular-nums; }

/* 상단 고정 바 (Must See와 같은 모양) */
.mhead { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.mhead .top { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 6px; }
.brand { font: 700 20px/1.2 var(--f-display); margin: 0; white-space: nowrap; }
.brand small { display: block; font: 400 11px/1.3 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
.mhead .sp { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pagehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-top: 18px; }
.pagehead h2 { font: 700 24px/1.25 var(--f-display); margin: 0; text-wrap: balance; }
.pagehead p { margin: 0; color: var(--muted); font-size: 13px; }
@media (max-width: 440px) { .mhead .top { gap: 6px; } .icon-btn { padding: 5px 9px; font-size: 12.5px; } }

main.gutter { padding-block: 20px 28px; display: grid; gap: 14px; }

.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip { background: var(--card); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.chip-name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-val { font-size: 16px; font-weight: 700; }

.sect { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
.sect h2 { font-family: var(--f-display); font-size: 17px; font-weight: 700; margin: 0; }
.sect span { font-size: 13px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 20px 22px 14px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; }
.card-name { font-family: var(--f-display); font-size: 21px; font-weight: 700; margin: 0; line-height: 1.25; }
.price { display: grid; gap: 1px; }
.price-close { font-size: 24px; font-weight: 800; line-height: 1.2; }
.price-chg { font-size: 15px; font-weight: 500; }
.legend { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; align-items: baseline; }
.legend .k20 { color: var(--ma20); }
.legend .k50 { color: var(--ma50); }
.legend .v { color: var(--muted); text-align: right; }
.legend .k20::before, .legend .k50::before { content: ""; display: inline-block; width: 14px; height: 2px; background: currentColor; vertical-align: middle; margin-right: 6px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

.chart { height: 250px; width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.grid-l { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.c-up { fill: var(--up); stroke: var(--up); }
.c-down { fill: var(--down); stroke: var(--down); }
.ma20 { fill: none; stroke: var(--ma20); stroke-width: 1.6; }
.cline { fill: none; stroke: var(--ink); stroke-width: 1.8; }
.ma50 { fill: none; stroke: var(--ma50); stroke-width: 1.6; }
.last-line { stroke-width: 1; stroke-dasharray: 2 3; }
.tag-txt { fill: #ffffff; font-size: 11px; font-weight: 700; font-family: var(--font); font-variant-numeric: tabular-nums; }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 4px; }
.foot div { display: grid; gap: 3px; }
.msg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 22px; color: var(--muted); font-size: 14px; line-height: 1.6; }

html.snap .chart { height: 200px; }
/* 지수 분류 탭·표 */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs .cnt { opacity: .6; font-size: 11px; }
.card-name .pickbtn { vertical-align: middle; margin-left: 4px; }
.card-name .unit { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.mtable { width: 100%; border-collapse: collapse; font-size: 15px; }
.mtable td { padding: 7px 4px; border-top: 1px solid var(--line); }
.mtable tr.gh td { font-size: 12px; font-weight: 800; color: var(--muted); padding-top: 14px; border-top: 0; }
.mtable .c, .mtable .d { text-align: right; white-space: nowrap; }
.mtable .s { width: 96px; text-align: right; }
.spk { stroke-width: 1.6; }
.spk.up { stroke: var(--up); } .spk.down { stroke: var(--down); } .spk.flat { stroke: var(--flat); }

/* 지수 줄 목록 */
.irow { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 6px; align-items: center; border-top: 1px solid var(--line); }
.irow-main { font: inherit; color: inherit; background: none; border: 0; padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 76px 90px 14px; gap: 10px; align-items: center; text-align: left; cursor: pointer; min-width: 0; }
.irow-main .nm { min-width: 0; overflow: hidden; }
.irow-main .nm b { font-weight: 600; font-size: 15px; }
.irow-main .nm small { display: block; font-size: 11.5px; color: var(--muted); }
.irow-main .cl { text-align: right; font-weight: 600; white-space: nowrap; }
.irow-main .ch { text-align: right; font-size: 13.5px; white-space: nowrap; }
.irow-main .sp { display: flex; justify-content: flex-end; }
.caret { color: var(--muted); font-size: 12px; }
.irow.open .irow-main .nm b { color: var(--ir); }
.irow-detail { display: grid; gap: 6px; padding: 4px 0 12px; }
.irow-detail .legend { justify-self: end; }
.det-sub { font-size: 12px; color: var(--muted); }
.rgrp { font-size: 12px; font-weight: 800; color: var(--muted); padding: 12px 0 2px; }
.blist { display: grid; grid-template-columns: minmax(0, 1fr); }
.brow, .srow, .mrow { font: inherit; color: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 70px 14px; gap: 10px; align-items: center; text-align: left; }
.brow { cursor: pointer; }
.srow { grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 70px; font-size: 13px; padding: 6px 0; }
.mrow { grid-template-columns: minmax(0, 1fr) 80px 70px 84px; }
.bn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bn small { color: var(--muted); font-size: 11.5px; }
.bv { text-align: right; font-weight: 600; white-space: nowrap; }
.mrow .cl { text-align: right; color: var(--muted); font-size: 13px; }
.mrow .sp { display: flex; justify-content: flex-end; }
.bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; }
.bar i.up { background: var(--up); } .bar i.down { background: var(--down); } .bar i.flat { background: var(--flat); }
.sec-detail { padding: 2px 0 10px 12px; border-left: 2px solid var(--ir-soft); margin-left: 4px; }
.gap { text-align: center; color: var(--muted); font-size: 12px; padding: 2px 0; }
.mcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 6px 24px; }
.mcol h3, .snap-h { font-size: 13px; font-weight: 800; margin: 4px 0; }
@media (max-width: 560px) {
  .irow-main { grid-template-columns: minmax(0, 1fr) auto 64px 14px; gap: 8px; }
  .irow-main .sp { display: none; }
  .brow { grid-template-columns: 96px minmax(0, 1fr) 62px 12px; gap: 8px; }
  .srow { grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 62px; gap: 8px; }
  .mrow { grid-template-columns: minmax(0, 1fr) 70px 64px; }
  .mrow .sp { display: none; }
}

html.snap .brow { grid-template-columns: 132px minmax(0, 1fr) 70px; }
html.snap .srow { grid-template-columns: 190px minmax(0, 1fr) 70px; }

/* 탭 */
.tab:focus-visible, .icon-btn:focus-visible, .fbtn:focus-visible, .cell:focus-visible, .nav-btn:focus-visible { outline: 2px solid var(--band-accent); outline-offset: 2px; }
html.snap .tabs { display: none; }

/* 증시 캘린더 */
.panel { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-h h2 { font-family: var(--f-display); font-size: 19px; font-weight: 700; margin: 0; }
.panel-h span { font-size: 12px; color: var(--muted); }
.cal-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-label { font-size: 20px; font-weight: 800; min-width: 7.5em; text-align: center; }
.nav-btn { font: inherit; font-size: 18px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.nav-btn:disabled { opacity: .35; cursor: default; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.fbtn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.fbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.grid-wrap { overflow-x: auto; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.dow { font-size: 12px; color: var(--muted); padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cell { font: inherit; color: inherit; text-align: left; background: var(--card); border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 112px; padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.cell.out { background: var(--soft); color: var(--muted); cursor: default; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--ir); }
.dnum { font-size: 12px; font-weight: 700; padding: 0 5px; border-radius: 999px; align-self: flex-start; }
.cell.today .dnum { background: var(--ink); color: var(--card); }
.ev { font-size: 11.5px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 5px; border-radius: 4px; }
.ev.m { background: var(--soft); }
.ev.i { background: var(--ir-soft); }
.ev.p { background: var(--p-soft); }
.ev.cov { font-weight: 800; }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; }
.dots { display: none; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.m { background: var(--muted); } .dot.i { background: var(--ir); } .dot.p { background: var(--ma20); }

.agenda { display: grid; gap: 14px; }
.aday { display: grid; gap: 0; }
.aday h3 { font-size: 14px; font-weight: 800; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
.aday h3 span { font-size: 12px; font-weight: 500; color: var(--muted); }
.item { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: start; }
.tag { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; justify-self: start; white-space: nowrap; }
.tag.m { background: var(--soft); color: var(--ink); }
.tag.i { background: var(--ir-soft); color: var(--ir); }
.tag.p { background: var(--p-soft); color: var(--ink); }
.tag.u { background: var(--u-soft); color: var(--ma50); }
.tag.n { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.ev.n { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.dot.n { background: transparent; border: 1px solid var(--muted); box-sizing: border-box; }
.ev.u { background: var(--u-soft); }
.dot.u { background: var(--ma50); }
.item .t { font-weight: 500; overflow-wrap: anywhere; }
.item .t a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.item .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.star { color: var(--ir); font-weight: 800; }
.citem { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; align-items: center; }
.citem .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.citem .r { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.morebtn { font: inherit; font-size: 12.5px; color: var(--ir); background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 0 2px; text-align: left; cursor: pointer; }
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 22px; align-items: start; }
.empty { font-size: 13px; color: var(--muted); padding: 6px 0; }
.daol-img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
details summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend-row i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* 기업 리스트 */
.comp-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: 0; background: var(--card); color: var(--muted); padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.comp-bar input, .comp-bar select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.comp-bar input { flex: 1 1 180px; }
.comp-bar select { flex: 0 1 220px; }
.pick-status { font-size: 12px; color: var(--muted); }
.grp { display: grid; grid-template-columns: minmax(0, 1fr); }
#comp .panel, #cal .panel { grid-template-columns: minmax(0, 1fr); }
.grp h3 { font-size: 13px; font-weight: 800; margin: 14px 0 4px; display: flex; gap: 8px; align-items: baseline; }
.grp h3 span { font-size: 12px; font-weight: 500; color: var(--muted); }
.crow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 84px 92px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.crow .nm { min-width: 0; }
.crow .nm b { font-weight: 600; }
.crow .nm .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .cap, .crow .nx { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.crow .nx b { color: var(--ink); font-weight: 600; }
.pickbtn { font: inherit; font-size: 18px; line-height: 1; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--line); cursor: pointer; }
.pickbtn[aria-pressed="true"] { color: var(--ma20); border-color: var(--ma20); }
.pickbtn.sm { width: 24px; height: 24px; font-size: 14px; border-radius: 6px; }
.item.has-pick { grid-template-columns: 62px minmax(0, 1fr) 26px; }
.danger { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
.danger.armed { color: var(--up); font-weight: 700; }
@media (max-width: 560px) {
  .crow { grid-template-columns: 32px minmax(0, 1fr) 76px; }
  .crow .cap { display: none; }
}

@media (max-width: 700px) {
  .cell { min-height: 54px; padding: 4px; gap: 4px; }
  .cell .ev, .cell .more { display: none; }

      var cls = m.v > 0 ? "up" : m.v < 0 ? "down" : "flat";
      var t = (m.v > 0 ? "+" : "") + m.v.toFixed(m.rate ? 1 : 2) + (m.rate ? "bp" : "%");
      return '<span class="nchip" title="' + esc(m.d) + ' 종가 기준"><b>' + esc(m.name) + '</b><span class="num ' + cls + '">' + t + '</span></span>';
    }).join("") + '</div>';
  }

  function render() {
    var root = $("study"); if (!root) return;
    var d = st.date, n = MNOTES.note(d) || blank(), t = today();
    var h = '<section class="panel study"><div class="panel-h"><h2>시장 노트</h2><span id="ns-status">' + esc(MNOTES.status()) + '</span></div>' +
      '<div class="snav"><button class="nav-btn" id="n-prev" aria-label="전날">‹</button><span class="sdate num">' + mdw(d) + (d === t ? " 오늘" : "") + '</span>' +
      '<button class="nav-btn" id="n-next" aria-label="다음날"' + (d >= t ? " disabled" : "") + '>›</button>' +
      (d !== t ? '<button class="fbtn" id="n-today">오늘로</button>' : "") + '</div>' +
      '<div id="n-due">' + Loop.dueHTML() + '</div>' +
      moveChips(d) +
      '<label class="nlab" for="n-line">오늘 시장 한 줄</label>' +
      '<input id="n-line" class="ninput" type="text" maxlength="200" placeholder="예: 금리 급등에 성장주 약세, 코스피는 외국인 매도로 1% 하락" value="' + esc(n.line) + '">' +
      '<label class="nlab" for="n-why">원인·근거 (내 말로)</label>' +
      '<textarea id="n-why" class="ninput" rows="3" placeholder="무엇 때문에 움직였는지, 근거가 된 뉴스·지표는 무엇인지">' + esc(n.why) + '</textarea>' +
      '<div class="nconf"><span class="nlab">확신도</span><span class="seg" role="group" aria-label="확신도">' +
      ["상", "중", "하"].map(function (c) { return '<button data-conf="' + c + '" aria-pressed="' + (n.conf === c) + '">' + c + '</button>'; }).join("") + '</span></div>' +
      '<details id="n-secbox"' + (Object.keys(n.sec || {}).length ? " open" : "") + '><summary>오늘 움직인 섹터 고르기' + secSummary(n) + '</summary><div id="n-sec">' + Loop.secChips(n.sec, "day") + '</div></details>' +
      '<div id="n-refs">' + refsHTML(n) + '</div>' +
      '<details id="n-ms"' + (st.showMs ? " open" : "") + '><summary>그날 Must See에서 근거 고르기</summary><div id="n-ms-list"><div class="empty">불러오는 중…</div></div></details>' +
      '<details id="n-hist"><summary>최근 노트</summary>' + histHTML() + '</details>' +
      '</section>';
    root.innerHTML = h;
    wire();
    loadMs();
  }
  function refsHTML(n) {
    var refs = n.refs || [];
    if (!refs.length) return '<div class="nlab">붙인 근거 없음 · 아래 Must See 글에서 ‘붙이기’를 누르세요</div>';
    return '<div class="nlab">붙인 근거 ' + refs.length + '건</div>' + refs.map(function (r, i) {
      return '<div class="nref"><div><div class="t"><b>' + esc(r.ch) + '</b> <span class="num" style="color:var(--muted)">' + esc(r.when || "") + '</span></div>' +
        '<div class="s">' + esc(r.s) + (r.link ? ' <a href="' + esc(r.link) + '" target="_blank" rel="noopener">원문 ↗</a>' : "") + '</div></div>' +
        '<button class="pickbtn sm" data-unref="' + i + '" aria-label="근거에서 빼기">✕</button></div>';
    }).join("");
  }
  function secSummary(n) {
    var ks = Object.keys(n.sec || {}); if (!ks.length) return "";
    return ' <span class="nlab" style="font-weight:400">' + ks.map(function (k) { return (n.sec[k] === "+" ? "▲" : "▼") + esc(k); }).join(" ") + '</span>';
  }
  function wireSec() {
    var box = $("n-sec"); if (!box) return;
    box.querySelectorAll("[data-sec]").forEach(function (b) {
      b.onclick = function () {
        var name = b.getAttribute("data-sec").split("|")[1];
        var n = current(); n.line = $("n-line").value; n.why = $("n-why").value; n.sec = n.sec || {};
        var v = Loop.cycle(n.sec[name]); if (v) n.sec[name] = v; else delete n.sec[name];
        NSET(n); box.innerHTML = Loop.secChips(n.sec, "day"); wireSec();
        var sm = $("n-secbox").querySelector("summary"); sm.innerHTML = "오늘 움직인 섹터 고르기" + secSummary(n);
      };
    });
  }
  function NSET(n) { MNOTES.setNote(st.date, n); }
  function histHTML() {
    var all = MNOTES.notes(), ds = Object.keys(all).filter(function (k) { return all[k] && (all[k].line || all[k].why); }).sort().reverse().slice(0, 14);
    if (!ds.length) return '<div class="empty">아직 쓴 노트가 없어요.</div>';
    return ds.map(function (k) {
      var x = all[k];
      return '<button class="nhist" data-go="' + k + '"><span class="num">' + mdw(k) + '</span><span class="t">' + esc(x.line || x.why.slice(0, 60)) + '</span><span class="tag ' + (x.conf === "상" ? "i" : x.conf === "하" ? "n" : "m") + '">' + esc(x.conf || "-") + '</span></button>';
    }).join("");
  }
  function current() { var n = MNOTES.note(st.date); return n ? JSON.parse(JSON.stringify(n)) : blank(); }
  var saveT = null;
  function saveFields() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      var n = current(); n.line = $("n-line").value; n.why = $("n-why").value; MNOTES.setNote(st.date, n);
    }, 500);
  }
  function wire() {
    $("n-prev").onclick = function () { go(addDays(st.date, -1)); };
    $("n-next").onclick = function () { go(addDays(st.date, 1)); };
    if ($("n-today")) $("n-today").onclick = function () { go(today()); };
    $("n-line").oninput = saveFields; $("n-why").oninput = saveFields;
    document.querySelectorAll("[data-conf]").forEach(function (b) {
      b.onclick = function () {
        var n = current(); n.line = $("n-line").value; n.why = $("n-why").value;
        n.conf = n.conf === b.getAttribute("data-conf") ? "" : b.getAttribute("data-conf");
        MNOTES.setNote(st.date, n); refreshParts();
      };
    });
    $("n-ms").ontoggle = function () { st.showMs = $("n-ms").open; };
    wireSec();
    wireRefs();
    document.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { go(b.getAttribute("data-go")); }; });
  }
  function wireRefs() {
    document.querySelectorAll("[data-unref]").forEach(function (b) {
      b.onclick = function () { var n = current(); n.refs.splice(+b.getAttribute("data-unref"), 1); MNOTES.setNote(st.date, n); refreshParts(); loadMs(); };
    });
  }
  function go(d) { flushNow(); st.date = d; render(); }
  function flushNow() {
    if (!saveT) return; clearTimeout(saveT); saveT = null;
    var n = current(); n.line = $("n-line").value; n.why = $("n-why").value; MNOTES.setNote(st.date, n);
  }
  // 입력 중일 때는 입력칸을 다시 그리지 않고 나머지만 갱신
  function refreshParts() {
    if (!$("n-refs")) return;
    var n = MNOTES.note(st.date) || blank();
    $("ns-status").textContent = MNOTES.status();
    if ($("n-due")) $("n-due").innerHTML = Loop.dueHTML();
    $("n-refs").innerHTML = refsHTML(n); wireRefs();
    document.querySelectorAll("[data-conf]").forEach(function (b) { b.setAttribute("aria-pressed", String(n.conf === b.getAttribute("data-conf"))); });
    var hist = $("n-hist"); if (hist) { var o = hist.open; hist.innerHTML = '<summary>최근 노트</summary>' + histHTML(); hist.open = o; hist.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { go(b.getAttribute("data-go")); }; }); }
    var a = document.activeElement;
    if (a !== $("n-line") && a !== $("n-why") && !saveT) { $("n-line").value = n.line || ""; $("n-why").value = n.why || ""; }
  }

  // 그날(과 전날 저녁) Must See 글
  function loadMs() {
    var d = st.date, list = $("n-ms-list"); if (!list) return;
    Promise.all([MS.loadDay(d).catch(function () { return null; }), MS.loadDay(addDays(d, -1)).catch(function () { return null; })]).then(function (r) {
      if (st.date !== d || !$("n-ms-list")) return;
      var used = {}; (current().refs || []).forEach(function (x) { used[x.id] = true; });
      var h = "";
      [[d, r[0], "당일"], [addDays(d, -1), r[1], "전날"]].forEach(function (g) {
        var items = (g[1] && g[1].items) || [];
        h += '<div class="rgrp">' + mdw(g[0]) + ' ' + g[2] + ' · ' + items.length + '건</div>';
        if (!items.length) { h += '<div class="empty">이날 모은 글이 없어요.</div>'; return; }
        items.slice().sort(function (a, b) { return (b.time || "").localeCompare(a.time || ""); }).forEach(function (it) {
          var s = text(it.html) || (it.web && (it.web.title || it.web.desc)) || (it.photos && it.photos.length ? "(사진)" : "(첨부)");
          var id = String(it.id);
          h += '<div class="nms"><div><div class="t"><b>' + esc(it.src.name) + '</b> <span class="num" style="color:var(--muted)">' + esc(it.time || "") + '</span></div>' +
            '<div class="s">' + esc(s.slice(0, 160)) + (s.length > 160 ? "…" : "") + '</div></div>' +
            (used[id] ? '<span class="nlab">붙임</span>' : '<button class="fbtn" data-ref="' + esc(g[0]) + '|' + esc(id) + '">붙이기</button>') + '</div>';
        });
      });
      list.innerHTML = h;
      list.querySelectorAll("[data-ref]").forEach(function (b) {
        b.onclick = function () {
          var v = b.getAttribute("data-ref").split("|"), day = v[0], id = v[1];
          var items = ((day === d ? r[0] : r[1]) || { items: [] }).items;
          var it = items.filter(function (x) { return String(x.id) === id; })[0]; if (!it) return;
          var n = current(); n.line = $("n-line").value; n.why = $("n-why").value;
          n.refs = n.refs || [];
          n.refs.push({ id: id, d: day, ch: it.src.name, when: mdw(day).slice(0, -3) + " " + (it.time || ""), s: (text(it.html) || (it.web && it.web.title) || "").slice(0, 220), link: it.orig_link || it.link || "" });
          MNOTES.setNote(st.date, n); refreshParts(); loadMs();
        };
      });
    });
  }

  function init(bundle) {
    st.bundle = bundle; st.date = today();
    MNOTES.on(refreshParts);
    render();
  }
  return { init: init, rerender: function () { if (st.date) render(); }, go: function (d) { go(d); }, refresh: function () { refreshParts(); } };
})();
</script>
<script>
/* 사전 예상 → 사후 확인 루프 + 주간 복기
   저장: MNOTES 의 ev(일정별 예상·결과), weeks(주간 정리). 일정 키 = 종류|날짜|나라·종목|이름 */
var SECTORS = {
  "내 커버리지": ["엔터", "미디어·콘텐츠", "레저·여행·카지노", "통신", "인터넷·게임"],
  "산업": ["반도체", "2차전지", "자동차", "조선·방산·기계", "바이오", "은행·보험", "증권", "건설·부동산", "화학·정유", "철강·소재", "유통·소비재", "항공·해운", "유틸리티"],
  "스타일": ["성장주", "가치주", "수출주", "내수주", "중소형주"]
};
var Loop = (function () {
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var CTRY = { KR: "한국", US: "미국", CN: "중국", JP: "일본", EU: "유럽", UK: "영국", DE: "독일", GL: "글로벌" };
  var reg = {}, cur = null, hooks = { changed: [] };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function today() { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
  function addDays(s, n) { var d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function mdw(s) { var d = new Date(s + "T00:00:00Z"); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "(" + DOW[d.getUTCDay()] + ")"; }
  function monday(s) { var d = new Date(s + "T00:00:00Z"); return addDays(s, -((d.getUTCDay() + 6) % 7)); }
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }

  // ---------- 일정 등록·키
  function key(x) {
    var e = x.e;
    if (x.k === "m") return ["m", e.date, e.country, e.title].join("|");
    if (x.k === "u") return ["u", e.date, e.symbol].join("|");
    return [x.k, e.date, e.code].join("|");
  }
  function info(x) {
    var e = x.e;
    if (x.k === "m") return { kind: "m", date: e.date, title: (CTRY[e.country] || "") + " " + e.title, sub: e.note || "", actual: e.actual || "", forecast: e.forecast || "", imp: e.imp };
    if (x.k === "u") return { kind: "u", date: e.date, title: e.name + " (" + e.symbol + ") 실적", sub: [e.timing, e.kst_label ? "한국 " + e.kst_label : "", e.eps_est != null ? "EPS 추정 " + e.eps_est : ""].filter(Boolean).join(" · "), actual: e.eps_act != null ? "EPS " + e.eps_act + (e.surprise != null ? " (서프 " + (e.surprise > 0 ? "+" : "") + Number(e.surprise).toFixed(1) + "%)" : "") : "" };
    if (x.k === "p") return { kind: "p", date: e.date, title: e.company + " 잠정실적", sub: e.period || "", actual: [e.op ? "영업익 " + e.op : "", e.op_diff ? "컨센 " + e.op_diff : ""].filter(Boolean).join(" · ") };
    return { kind: x.k, date: e.date, title: e.company + (x.k === "n" ? " IR" : " 실적 발표"), sub: [e.period, e.time].filter(Boolean).join(" · "), actual: "" };
  }
  function register(x) { var k = key(x); if (!reg[k]) reg[k] = info(x); return k; }
  function state(k) {
    var v = MNOTES.ev(k); if (!v) return "";
    var hasPre = v.pre && (v.pre.dir || v.pre.react || v.pre.memo || Object.keys(v.pre.sec || {}).length);
    var hasPost = v.post && (v.post.hit || v.post.memo);
    return hasPost ? "post" : hasPre ? "pre" : "";
  }
  function badge(k) {
    var s = state(k), d = (reg[k] || {}).date || "";
    if (s === "post") { var h = MNOTES.ev(k).post.hit; return '<span class="evb ' + (h === "적중" ? "ok" : h === "빗나감" ? "ng" : "mid") + '">' + esc(h || "결과") + '</span>'; }
    if (s === "pre") return '<span class="evb ' + (d && d <= today() ? "due" : "pre") + '">' + (d && d <= today() ? "결과 확인" : "예상 ✓") + '</span>';
    return "";
  }
  // 캘린더 항목에 버튼 끼우기
  function decorate(html, x) {
    var k = register(x), s = state(k);
    var label = s === "post" ? "다시 보기" : s === "pre" ? (x.e.date <= today() ? "결과 적기" : "예상 고치기") : (x.e.date < today() ? "복기" : "예상 적기");
    var btn = ' <button class="evbtn" data-ev="' + esc(k) + '">' + badge(k) + label + '</button>';
    var i = html.indexOf('<div class="t">'); if (i < 0) return html;
    var j = html.indexOf("</div>", i);
    return html.slice(0, j) + btn + html.slice(j);
  }
  function decorateCompact(html, x) {
    var k = register(x);
    return html.replace('<div class="citem"', '<div class="citem clk" data-ev="' + esc(k) + '" role="button" tabindex="0"')
      .replace('<span class="t">', '<span class="t">' + badge(k));
  }

  // ---------- 섹터 칩 (누를 때마다 없음 → 수혜 → 부담 → 없음)
  function secChips(map, scope) {
    map = map || {};
    return Object.keys(SECTORS).map(function (g) {
      return '<div class="secg"><span class="nlab">' + g + '</span><div class="secs">' + SECTORS[g].map(function (n) {
        var v = map[n] || "";
        return '<button class="sec ' + (v === "+" ? "plus" : v === "-" ? "minus" : "") + '" data-sec="' + esc(scope) + '|' + esc(n) + '">' + (v === "+" ? "▲ " : v === "-" ? "▼ " : "") + esc(n) + '</button>';
      }).join("") + '</div></div>';
    }).join("") + '<div class="nlab">한 번 누르면 ▲수혜, 두 번 ▼부담, 세 번 해제</div>';
  }
  function cycle(v) { return v === "" || v == null ? "+" : v === "+" ? "-" : ""; }

  // ---------- 편집 창
  function open(k) {
    var it = reg[k]; if (!it) return;
    cur = k;
    var v = clone(MNOTES.ev(k)); v.pre = v.pre || {}; v.post = v.post || {};
    var past = it.date <= today();
    var h = '<div class="sheet" role="dialog" aria-modal="true" aria-label="예상·결과">' +
      '<div class="sheet-h"><div><div class="nlab">' + mdw(it.date) + (it.imp === "H" ? ' · <span class="star">● 중요</span>' : "") + '</div><h2>' + esc(it.title) + '</h2>' +
      (it.sub ? '<div class="nlab" style="font-weight:400">' + esc(it.sub) + '</div>' : "") + '</div><button class="icon-btn" id="ev-x">닫기</button></div>' +
      '<section class="sbox"><h3>① 발표 전 예상</h3>' +
      '<div class="nconf"><span class="nlab">결과는</span><span class="seg" data-grp="dir">' + ["상회", "부합", "하회"].map(function (c) { return '<button data-v="' + c + '" aria-pressed="' + (v.pre.dir === c) + '">' + (it.kind === "m" ? "예상치 " : "컨센 ") + c + '</button>'; }).join("") + '</span></div>' +
      '<label class="nlab" for="ev-react">시장 반응 예상</label><input id="ev-react" class="ninput" placeholder="예: 금리 상승 → 성장주 약세, 원화 약세" value="' + esc(v.pre.react || "") + '">' +
      '<div class="nlab">영향 갈 섹터</div><div id="ev-sec-pre">' + secChips(v.pre.sec, "pre") + '</div>' +
      '<label class="nlab" for="ev-pmemo">근거 메모</label><textarea id="ev-pmemo" class="ninput" rows="2" placeholder="왜 그렇게 보는지">' + esc(v.pre.memo || "") + '</textarea>' +
      '</section>' +
      '<section class="sbox' + (past ? "" : " dim") + '"><h3>② 발표 후 확인' + (past ? "" : ' <span class="nlab">발표 후에 적어요</span>') + '</h3>' +
      '<label class="nlab" for="ev-act">실제 결과</label><input id="ev-act" class="ninput" placeholder="' + esc(it.actual || "실제치·시장 반응") + '" value="' + esc(v.post.actual || it.actual || "") + '">' +
      '<div class="nconf"><span class="nlab">내 예상은</span><span class="seg" data-grp="hit">' + ["적중", "부분", "빗나감"].map(function (c) { return '<button data-v="' + c + '" aria-pressed="' + (v.post.hit === c) + '">' + c + '</button>'; }).join("") + '</span></div>' +
      '<div id="ev-sec-post">' + postSecHTML(v) + '</div>' +
      '<label class="nlab" for="ev-qmemo">배운 점</label><textarea id="ev-qmemo" class="ninput" rows="2" placeholder="예상과 달랐던 이유, 다음에 볼 것">' + esc(v.post.memo || "") + '</textarea>' +
      '</section><div class="nlab" id="ev-status">' + esc(MNOTES.status()) + '</div></div>';
    var ov = $("ev-ov"); ov.innerHTML = h; ov.hidden = false; document.body.style.overflow = "hidden";
    wire();
  }
  function postSecHTML(v) {
    var sec = (v.pre && v.pre.sec) || {}, names = Object.keys(sec);
    if (!names.length) return "";
    var ps = (v.post && v.post.sec) || {};
    return '<div class="nlab">섹터 예상 맞았나</div>' + names.map(function (n) {
      return '<div class="secchk"><span class="sec ' + (sec[n] === "+" ? "plus" : "minus") + '">' + (sec[n] === "+" ? "▲ " : "▼ ") + esc(n) + '</span><span class="seg" data-grp="psec" data-n="' + esc(n) + '">' +
        [["o", "맞음"], ["x", "틀림"]].map(function (c) { return '<button data-v="' + c[0] + '" aria-pressed="' + (ps[n] === c[0]) + '">' + c[1] + '</button>'; }).join("") + '</span></div>';
    }).join("");
  }
  function read() {
    var v = clone(MNOTES.ev(cur)); v.pre = v.pre || {}; v.post = v.post || {};
    var it = reg[cur];
    v.d = it.date; v.title = it.title; v.kind = it.kind;
    v.pre.react = $("ev-react").value; v.pre.memo = $("ev-pmemo").value;
    v.post.actual = $("ev-act").value; v.post.memo = $("ev-qmemo").value;
    return v;
  }
  var tmr = null;
  function save(v, now) {
    clearTimeout(tmr);
    var k = cur;
    var go = function () { MNOTES.setEv(k, v || read()); if ($("ev-status")) $("ev-status").textContent = MNOTES.status(); };
    if (now) go(); else tmr = setTimeout(go, 500);
  }
  function wire() {
    $("ev-x").onclick = close;
    ["ev-react", "ev-pmemo", "ev-act", "ev-qmemo"].forEach(function (id) { $(id).oninput = function () { save(); }; });
    $("ev-ov").querySelectorAll(".seg[data-grp] button").forEach(function (b) {
      b.onclick = function () {
        var g = b.parentNode.getAttribute("data-grp"), val = b.getAttribute("data-v"), v = read();
        if (g === "dir") v.pre.dir = v.pre.dir === val ? "" : val;
        if (g === "hit") v.post.hit = v.post.hit === val ? "" : val;
        if (g === "psec") { var n = b.parentNode.getAttribute("data-n"); v.post.sec = v.post.sec || {}; v.post.sec[n] = v.post.sec[n] === val ? "" : val; }
        save(v, true);
        b.parentNode.querySelectorAll("button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b && o.getAttribute("aria-pressed") !== "true")); });
      };
    });
    wireSec($("ev-sec-pre"), function (n) {
      var v = read(); v.pre.sec = v.pre.sec || {}; var nv = cycle(v.pre.sec[n]);
      if (nv) v.pre.sec[n] = nv; else delete v.pre.sec[n];
      save(v, true);
      $("ev-sec-pre").innerHTML = secChips(v.pre.sec, "pre");
      $("ev-sec-post").innerHTML = postSecHTML(v); wire();
    });
  }
  function wireSec(root, fn) {
    if (!root) return;
    root.querySelectorAll("[data-sec]").forEach(function (b) { b.onclick = function () { fn(b.getAttribute("data-sec").split("|")[1]); }; });
  }
  function close() {
    if (cur && tmr) save(null, true);
    cur = null; $("ev-ov").hidden = true; $("ev-ov").innerHTML = ""; document.body.style.overflow = "";
    hooks.changed.forEach(function (f) { try { f(); } catch (e) {} });
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && cur) close(); });
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-ev]");
    if (t) { e.preventDefault(); e.stopPropagation(); open(t.getAttribute("data-ev")); return; }
    if (e.target.id === "ev-ov") close();
  }, true);

  // ---------- 결과 확인 대기 (시장 노트 위에 표시)
  function due() {
    var all = MNOTES.evs(), t = today();
    return Object.keys(all).filter(function (k) {
      var v = all[k]; return v && v.d && v.d <= t && v.pre && (v.pre.dir || v.pre.react || v.pre.memo) && !(v.post && v.post.hit);
    }).sort(function (a, b) { return all[a].d < all[b].d ? -1 : 1; });
  }
  function dueHTML() {
    var ks = due(); if (!ks.length) return "";
    var all = MNOTES.evs();
    return '<div class="duebox"><div class="nlab">결과 확인할 일정 ' + ks.length + '건 · 예상과 비교해 보세요</div>' + ks.slice(0, 6).map(function (k) {
      if (!reg[k]) reg[k] = { kind: all[k].kind, date: all[k].d, title: all[k].title, sub: "", actual: "" };
      return '<button class="duerow" data-ev="' + esc(k) + '"><span class="num">' + mdw(all[k].d) + '</span><span class="t">' + esc(all[k].title) + '</span><span class="evb due">예상 ' + esc(all[k].pre.dir || "✓") + '</span></button>';
    }).join("") + '</div>';
  }

  // ---------- 주간 복기
  var wk = null;
  var CORE = [["SPX", "S&P"], ["IXIC", "나스닥"], ["KOSPI", "코스피"], ["KOSDAQ", "코스닥"], ["US10Y", "미 10년"], ["USDKRW", "원/달러"], ["WTI", "WTI"]];
  function weekMoves(m, data) {
    if (!data) return [];
    var by = {}; data.indices.forEach(function (i) { by[i.key] = i; });
    var end = addDays(m, 6), prevEnd = addDays(m, -1);
    return CORE.map(function (c) {
      var i = by[c[0]]; if (!i) return null;
      var a = null, b = null;
      i.bars.forEach(function (x) { if (x[0] <= prevEnd) a = x; if (x[0] <= end && x[0] >= m) b = x; });
      if (!a || !b) return null;
      var rate = i.region === "RATE";
      return { name: c[1], v: rate ? (b[4] - a[4]) * 100 : (b[4] / a[4] - 1) * 100, rate: rate };
    }).filter(Boolean);
  }
  function renderReview(bundle) {
    var root = $("rev"); if (!root) return;
    if (!wk) wk = monday(today());
    var end = addDays(wk, 6), t = today();
    var notes = MNOTES.notes(), evs = MNOTES.evs(), w = MNOTES.week(wk) || {};
    var h = '<section class="panel"><div class="snav"><button class="nav-btn" id="rv-prev" aria-label="지난주">‹</button><span class="sdate num">' + mdw(wk) + ' – ' + mdw(end) + '</span>' +
      '<button class="nav-btn" id="rv-next" aria-label="다음주"' + (wk >= monday(t) ? " disabled" : "") + '>›</button>' + (wk !== monday(t) ? '<button class="fbtn" id="rv-now">이번 주</button>' : "") + '</div>';
    var mv = weekMoves(wk, bundle && bundle.data);
    if (mv.length) h += '<div class="nlab">주간 등락 (전주 마지막 거래일 종가 대비)</div><div class="nchips">' + mv.map(function (m) {
      var cls = m.v > 0 ? "up" : m.v < 0 ? "down" : "flat";
      return '<span class="nchip"><b>' + m.name + '</b><span class="num ' + cls + '">' + (m.v > 0 ? "+" : "") + m.v.toFixed(m.rate ? 1 : 2) + (m.rate ? "bp" : "%") + '</span></span>';
    }).join("") + '</div>';
    h += '<label class="nlab" for="rv-sum">이번 주 한 줄 정리</label><input id="rv-sum" class="ninput" placeholder="예: 금리 피크아웃 기대 vs 실적 실망, 지수는 박스권" value="' + esc(w.sum || "") + '">' +
      '<label class="nlab" for="rv-learn">배운 점 · 다음 주에 볼 것</label><textarea id="rv-learn" class="ninput" rows="3">' + esc(w.learn || "") + '</textarea>' +
      '<div class="nlab" id="rv-status">' + esc(MNOTES.status()) + '</div></section>';

    // 일별 노트
    h += '<section class="panel"><div class="panel-h"><h2>일별 시장 노트</h2></div>';
    var any = false;
    for (var i = 0; i < 7; i++) {
      var d = addDays(wk, i), n = notes[d];
      if (!n || !(n.line || n.why)) continue;
      any = true;
      var sec = Object.keys(n.sec || {});
      h += '<button class="nhist" data-goday="' + d + '"><span class="num">' + mdw(d) + '</span><span class="t">' + esc(n.line || n.why.slice(0, 80)) +
        (sec.length ? ' <span class="nlab" style="font-weight:400">· ' + sec.map(function (s) { return (n.sec[s] === "+" ? "▲" : "▼") + esc(s); }).join(" ") + '</span>' : "") +
        '</span><span class="tag ' + (n.conf === "상" ? "i" : n.conf === "하" ? "n" : "m") + '">' + esc(n.conf || "-") + '</span></button>';
    }
    if (!any) h += '<div class="empty">이번 주에 쓴 노트가 없어요.</div>';
    h += '</section>';

    // 예상 vs 결과
    var wkEv = Object.keys(evs).filter(function (k) { var v = evs[k]; return v && v.d >= wk && v.d <= end && v.pre && (v.pre.dir || v.pre.react || v.pre.memo || Object.keys(v.pre.sec || {}).length); })
      .sort(function (a, b) { return evs[a].d < evs[b].d ? -1 : 1; });
    var hit = { "적중": 0, "부분": 0, "빗나감": 0 }, pending = 0;
    wkEv.forEach(function (k) { var x = evs[k].post && evs[k].post.hit; if (x) hit[x]++; else pending++; });
    var done = hit["적중"] + hit["부분"] + hit["빗나감"];
    h += '<section class="panel"><div class="panel-h"><h2>예상 vs 결과</h2><span>' + (done ? "적중률 " + Math.round((hit["적중"] + hit["부분"] * 0.5) / done * 100) + "% (부분은 반)" : "") + '</span></div>';
    if (wkEv.length) {
      h += '<div class="nchips"><span class="nchip"><b>적중</b><span class="num">' + hit["적중"] + '</span></span><span class="nchip"><b>부분</b><span class="num">' + hit["부분"] + '</span></span><span class="nchip"><b>빗나감</b><span class="num">' + hit["빗나감"] + '</span></span><span class="nchip"><b>결과 대기</b><span class="num">' + pending + '</span></span></div>';
      wkEv.forEach(function (k) {
        var v = evs[k];
        if (!reg[k]) reg[k] = { kind: v.kind, date: v.d, title: v.title, sub: "", actual: "" };
        h += '<button class="duerow" data-ev="' + esc(k) + '"><span class="num">' + mdw(v.d) + '</span><span class="t">' + esc(v.title) +
          '<span class="s">예상 ' + esc(v.pre.dir || "-") + (v.pre.react ? " · " + esc(v.pre.react) : "") + (v.post && v.post.actual ? " → 실제 " + esc(v.post.actual) : "") + '</span></span>' +
          '<span class="evb ' + (!v.post || !v.post.hit ? "due" : v.post.hit === "적중" ? "ok" : v.post.hit === "빗나감" ? "ng" : "mid") + '">' + esc((v.post && v.post.hit) || "대기") + '</span></button>';
      });
    } else h += '<div class="empty">이번 주에 예상을 적은 일정이 없어요. 증시 캘린더에서 일정의 ‘예상 적기’를 눌러 보세요.</div>';
    h += '</section>';

    // 섹터 집계
    var tally = {};
    function add(n, dir, res) { var x = tally[n] = tally[n] || { p: 0, m: 0, o: 0, x: 0, dp: 0, dm: 0 }; if (dir === "+") x.p++; else if (dir === "-") x.m++; if (res === "o") x.o++; if (res === "x") x.x++; }
    wkEv.forEach(function (k) { var v = evs[k], s = v.pre.sec || {}, r = (v.post && v.post.sec) || {}; Object.keys(s).forEach(function (n) { add(n, s[n], r[n]); }); });
    for (var j = 0; j < 7; j++) { var nn = notes[addDays(wk, j)]; if (nn && nn.sec) Object.keys(nn.sec).forEach(function (n) { add(n, ""); if (nn.sec[n] === "+") tally[n].dp++; else tally[n].dm++; }); }
    var names = Object.keys(tally).sort(function (a, b) { var A = tally[a], B = tally[b]; return (B.p + B.m + B.dp + B.dm) - (A.p + A.m + A.dp + A.dm); });
    h += '<section class="panel"><div class="panel-h"><h2>섹터</h2><span>예상에서 고른 ▲수혜·▼부담 · 노트에서 고른 강세·약세 · 예상 맞음/틀림</span></div>';
    if (names.length) names.forEach(function (n) {
      var x = tally[n];
      h += '<div class="secrow"><b>' + esc(n) + '</b><span class="num">' + (x.p ? '<span class="up">▲' + x.p + '</span> ' : "") + (x.m ? '<span class="down">▼' + x.m + '</span> ' : "") + (x.dp || x.dm ? '· 노트 ' + (x.dp ? '<span class="up">▲' + x.dp + '</span> ' : "") + (x.dm ? '<span class="down">▼' + x.dm + '</span>' : "") : "") + '</span><span class="num nlab">' + (x.o + x.x ? "맞음 " + x.o + " · 틀림 " + x.x : "") + '</span></div>';
    });
    else h += '<div class="empty">아직 고른 섹터가 없어요.</div>';
    h += '</section>';

    // 다음 주 예상 적을 일정
    if (bundle && bundle.macro && wk === monday(t)) {
      var nm = addDays(wk, 7), ne = addDays(wk, 13);
      var up = bundle.macro.filter(function (e) { return e.imp === "H" && e.date >= t && e.date <= ne; });
      h += '<section class="panel"><div class="panel-h"><h2>예상 적을 중요 일정</h2><span>오늘 ~ 다음 주 · ● 중요도 상</span></div>';
      if (!up.length) h += '<div class="empty">표시할 일정이 없어요.</div>';
      up.forEach(function (e) {
        var k = register({ k: "m", e: e }), s = state(k);
        h += '<button class="duerow" data-ev="' + esc(k) + '"><span class="num">' + mdw(e.date) + '</span><span class="t">' + esc((CTRY[e.country] || "") + " " + e.title) + '<span class="s">' + esc(e.note || "") + '</span></span>' + (s ? badge(k) : '<span class="evb">예상 적기</span>') + '</button>';
      });
      h += '</section>';
    }
    root.innerHTML = h;
    $("rv-prev").onclick = function () { flushWeek(); wk = addDays(wk, -7); renderReview(bundle); };
    $("rv-next").onclick = function () { flushWeek(); wk = addDays(wk, 7); renderReview(bundle); };
    if ($("rv-now")) $("rv-now").onclick = function () { flushWeek(); wk = monday(today()); renderReview(bundle); };
    var wt = null;
    function saveWeek() { clearTimeout(wt); wt = setTimeout(flushWeek, 500); }
    flushWeek = function () { if (!$("rv-sum")) return; clearTimeout(wt); var v = { sum: $("rv-sum").value, learn: $("rv-learn").value }; var o = MNOTES.week(wk) || {}; if (o.sum === v.sum && o.learn === v.learn) return; MNOTES.setWeek(wk, v); if ($("rv-status")) $("rv-status").textContent = MNOTES.status(); };
    $("rv-sum").oninput = saveWeek; $("rv-learn").oninput = saveWeek;
    root.querySelectorAll("[data-goday]").forEach(function (b) { b.onclick = function () { hooks.goDay && hooks.goDay(b.getAttribute("data-goday")); }; });
  }
  var flushWeek = function () {};
  return { decorate: decorate, decorateCompact: decorateCompact, register: register, open: open, dueHTML: dueHTML,

})();

<script>
(function () {
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  function fmt(v, d) {
    if (v == null || isNaN(v)) return "-";
    return Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function md(s) { return s.slice(5, 7) + "/" + s.slice(8, 10); }
  function mdw(s) {
    var d = new Date(s + "T00:00:00Z");
    return md(s) + "(" + DOW[d.getUTCDay()] + ")";
  }
  function dir(x) { return x > 0 ? "up" : x < 0 ? "down" : "flat"; }
  function sign(x, d) { return (x > 0 ? "+" : "") + fmt(x, d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function drawChart(box, idx) {
    box.innerHTML = "";
    var W = box.clientWidth, H = box.clientHeight;
    if (W < 50) return;
    var bars = idx.bars, n = bars.length;
    var padR = 60, padT = 10, padB = 24;
    var pw = W - padR, ph = H - padT - padB;
    var lo = Infinity, hi = -Infinity;
    bars.forEach(function (b) {
      [b[3], b[5], b[6]].forEach(function (v) { if (v != null && v < lo) lo = v; });
      [b[2], b[5], b[6]].forEach(function (v) { if (v != null && v > hi) hi = v; });
    });
    var span = hi - lo || 1;
    lo -= span * 0.04; hi += span * 0.04;
    var y = function (v) { return padT + (hi - v) / (hi - lo) * ph; };
    var step = pw / n;
    var x = function (i) { return (i + 0.5) * step; };
    var cw = Math.max(1.4, step * 0.62);

    var svg = el("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": idx.name + " 일봉 차트" }, box);

    // 가로 눈금 5개 (실제 축 범위 안의 값만, 종가 태그와 겹치는 라벨은 생략)
    var lastY = y(bars[n - 1][4]);
    var rng = hi - lo, td = rng < 0.5 ? 3 : rng < 5 ? 2 : rng < 50 ? 1 : 0;
    for (var t = 0; t < 5; t++) {
      var v = hi - (hi - lo) * t / 4, yy = y(v);
      el("line", { x1: 0, x2: pw, y1: yy, y2: yy, "class": "grid-l" }, svg);
      if (Math.abs(yy - lastY) < 16) continue;
      var tx = el("text", { x: pw + 8, y: yy, "dominant-baseline": "middle", "class": "ax" }, svg);
      tx.textContent = fmt(v, td);
    }
    // 날짜 라벨
    [0, Math.round((n - 1) / 3), Math.round((n - 1) * 2 / 3), n - 1].forEach(function (i, k) {
      var a = k === 0 ? "start" : k === 3 ? "end" : "middle";
      var xx = k === 0 ? 0 : k === 3 ? pw : x(i);
      var tx = el("text", { x: xx, y: H - 6, "text-anchor": a, "class": "ax" }, svg);
      tx.textContent = md(bars[i][0]);
    });

    // 종가만 있는 자료(재무부·FRED 금리)는 선 그래프
    if (idx.line) {
      var dl = "";
      bars.forEach(function (b, i) { dl += (dl ? "L" : "M") + x(i).toFixed(1) + " " + y(b[4]).toFixed(1); });
      el("path", { d: dl, "class": "cline" }, svg);
    }
    // 캔들
    if (!idx.line) bars.forEach(function (b, i) {
      var o = b[1], h = b[2], l = b[3], c = b[4];
      var cls = c >= o ? "c-up" : "c-down";
      var cx = x(i);
      el("line", { x1: cx, x2: cx, y1: y(h), y2: y(l), "class": cls, "stroke-width": 1 }, svg);
      var top = y(Math.max(o, c)), bot = y(Math.min(o, c));
      el("rect", { x: cx - cw / 2, y: top, width: cw, height: Math.max(1, bot - top), "class": cls, "stroke-width": 0 }, svg);
    });

    // 이동평균선
    [[5, "ma20"], [6, "ma50"]].forEach(function (p) {
      var d = "";
      bars.forEach(function (b, i) {
        if (b[p[0]] == null) return;
        d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(b[p[0]]).toFixed(1);
      });
      if (d) el("path", { d: d, "class": p[1] }, svg);
    });

    // 최종 종가 표시
    var last = bars[n - 1], ly = y(last[4]);
    var lc = idx.chg_pct >= 0 ? "c-up" : "c-down";
    el("line", { x1: 0, x2: pw, y1: ly, y2: ly, "class": "last-line " + lc, fill: "none" }, svg);
    el("rect", { x: pw + 2, y: ly - 9, width: padR - 2, height: 18, rx: 3, "class": lc, "stroke-width": 0 }, svg);
    var tt = el("text", { x: pw + 2 + (padR - 2) / 2, y: ly, "text-anchor": "middle", "dominant-baseline": "middle", "class": "tag-txt" }, svg);
    tt.textContent = fmt(last[4], Math.max(td, idx.dec >= 2 ? Math.min(idx.dec, 2) : 0));
  }

  var IDX_GROUPS = [["pick", "★ 중요"], ["US", "미국"], ["KR", "한국"], ["ASIA", "아시아"], ["FX", "환율"], ["RATE", "금리"], ["CMDTY", "원자재"]];
  var GROUP_NAME = { US: "미국", KR: "한국", ASIA: "아시아", FX: "환율", RATE: "금리", CMDTY: "원자재" };
  var DEFAULT_IDX = ["SPX", "IXIC", "KOSPI", "KOSDAQ", "US10Y", "USDKRW", "WTI"];
  var idxView = { tab: "pick", data: null, byKey: {} };
  try { var _t = localStorage.getItem("idxTab"); if (_t) idxView.tab = _t; } catch (e) {}

  function chgText(i) {
    if (i.region === "RATE") return sign(i.chg * 100, 1) + "bp";
    return sign(i.chg, i.dec || 1) + " (" + sign(i.chg_pct, 2) + "%)";
  }
  function chipText(i) { return i.region === "RATE" ? sign(i.chg * 100, 1) + "bp" : sign(i.chg_pct, 2) + "%"; }
  function closeText(i) { return fmt(i.close, i.dec == null ? 1 : i.dec) + (i.unit === "%" ? "%" : ""); }

  function card(idx) {
    var d = dir(idx.chg_pct), dc = idx.dec == null ? 1 : idx.dec;
    var star = window.MARKET_DATA ? "" : " " + pickBtn("idx", idx.key, true);
    return '<section class="card">' +
      '<div class="card-head">' +
        '<h3 class="card-name">' + esc(idx.name) + star + (idx.unit && idx.unit !== "%" ? '<span class="unit">' + esc(idx.unit) + '</span>' : "") + '</h3>' +

    }).catch(function (e) { fail("마켓 화면을 열지 못했어요: " + (e && e.message || e)); });
  }
})();
